name: Rust

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-26.04 # windows runner's IOs are so slow
          - target: aarch64-pc-windows-gnu
            runner: ubuntu-26.04-arm # windows runner's IOs are so slow
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            test: true
            libc: 'musl'
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            test: true
            libc: 'glibc'
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
            test: true
            libc: 'musl'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            test: true
            libc: 'glibc'
          # Experimental. See https://wiki.debian.org/X32Port
          - target: x86_64-unknown-linux-gnux32
            runner: ubuntu-26.04
          # Oracle Cloud Infrastructure
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            test: true
            libc: 'glibc'
          # Minimum tested targets for macOS was increased to 15 - GHA drops 14 support on 2026/11/2.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            test: true
          - target: aarch64-apple-darwin
            runner: macos-15
            test: true
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            test: true
          - target: aarch64-apple-darwin
            runner: macos-26
            test: true
          
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup toolchain
      run: |
        rustup target add '${{ matrix.target }}'
    - name: Install musl-tools
      id: setup-musl
      run: |
        sudo apt update && sudo apt install musl-tools
      if: ${{ matrix.libc == 'musl' }}
    - name: Install gcc-aarch64-linux-gnu
      id: setup-aarch64-linux
      run: |
        sudo apt update && sudo apt install gcc-aarch64-linux-gnu
      if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
    - name: Install gcc-mingw-w64-x86-64
      id: setup-mingw-w64
      run: |
        sudo apt update && sudo apt install gcc-mingw-w64-x86-64
      if: ${{ matrix.target == 'x86_64-pc-windows-gnu' }}
    - name: Install x32 toolchain
      id: setup-x32-linux
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libc6-dev-x32 \
          libx32gcc-s1 \
          libx32gcc-13-dev
      if: ${{ matrix.target == 'x86_64-unknown-linux-gnux32' }}
    - name: Download cache
      uses: Swatinem/rust-cache@v2
      with:
        key: '${{ matrix.target }}'
        prefix-key: '${{ env.CI_RUST_CACHE_VERSION }}'
      env:
        CI_RUST_CACHE_VERSION: v0
    - name: Compile check
      run: cargo check --verbose --target '${{ matrix.target }}'
    - name: Lint with clippy
      run: cargo clippy --verbose --target '${{ matrix.target }}'
    - name: Run tests
      run: cargo test --verbose --target '${{ matrix.target }}'
      if: ${{ matrix.test == true }}
